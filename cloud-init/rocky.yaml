#cloud-config
# Rocky Linux 9/10 (ARM64 and x86_64): Docker, GitLab Runner, Docker Hub cache, cleanup timers.
# Generated by tools/render-cloud-init.py from cloud-init/templates. Do not edit by hand.
# Admin tools (htop, btop, ncdu, iotop, mtr, nano, vim, rsync, wget, unzip, bash-completion, skopeo, restic, dnf-utils)
# are installed in runcmd after EPEL is enabled, one by one: htop and several others come from EPEL,
# so listing it under packages: would break the whole package step. Missing ones go to /var/log/ci-bootstrap-failed.log.
package_update: true
package_upgrade: true

packages:
  - curl
  - ca-certificates
  - git
  - jq
  - tmux
  - dnf-automatic
  - policycoreutils-python-utils
  - bind-utils
  - lsof
  - sysstat
  - tcpdump
  - traceroute
  - nmap-ncat

ssh_pwauth: false

write_files:
  - path: /etc/ssh/sshd_config.d/60-ci-hardening.conf
    permissions: '0600'
    content: |
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PermitRootLogin prohibit-password
      X11Forwarding no

  - path: /etc/gai.conf
    append: true
    content: |
      precedence ::ffff:0:0/96  100

  - path: /etc/systemd/journald.conf.d/50-size.conf
    permissions: '0644'
    content: |
      [Journal]
      SystemMaxUse=500M
      MaxRetentionSec=14day

  - path: /etc/docker/daemon.json
    permissions: '0644'
    content: |
      {
        "log-driver": "json-file",
        "log-opts": { "max-size": "50m", "max-file": "3" },
        "registry-mirrors": ["http://127.0.0.1:5000"]
      }

  - path: /etc/gitlab-runner/config.toml
    permissions: '0600'
    content: |
      concurrent = 2
      check_interval = 0
      listen_address = "127.0.0.1:9252"

  - path: /opt/registry-cache/config.yml
    permissions: '0644'
    content: |
      version: 0.1
      log:
        level: info
        fields:
          service: registry-cache
      storage:
        filesystem:
          rootdirectory: /var/lib/registry
        delete:
          enabled: true
        cache:
          blobdescriptor: inmemory
      http:
        addr: 127.0.0.1:5000
        headers:
          X-Content-Type-Options: [nosniff]
        debug:
          addr: 127.0.0.1:5001
          prometheus:
            enabled: true
            path: /metrics
      proxy:
        remoteurl: https://registry-1.docker.io
      health:
        storagedriver:
          enabled: true
          interval: 10s
          threshold: 3

  - path: /opt/registry-cache/docker-compose.yml
    permissions: '0644'
    content: |
      name: registry-cache

      services:
        registry:
          image: registry:2.8.3
          restart: unless-stopped
          network_mode: host
          mem_limit: 128m
          volumes:
            - ./config.yml:/etc/docker/registry/config.yml:ro
            - registry-data:/var/lib/registry

      volumes:
        registry-data:

  - path: /usr/local/bin/runner-weekly-cleanup.sh
    permissions: '0755'
    content: |
      #!/usr/bin/env bash
      # Weekly cleanup of the GitLab Runner host: Docker, runner caches, packages, logs, temp files.
      set -Eeuo pipefail

      RETENTION_DAYS="${RETENTION_DAYS:-7}"
      JOURNAL_MAX="${JOURNAL_MAX:-500M}"
      SHARED_CACHE_DIR="${SHARED_CACHE_DIR:-/srv/ci-cache}"
      SHARED_CACHE_MAX_AGE_DAYS="${SHARED_CACHE_MAX_AGE_DAYS:-14}"
      DRY_RUN="${DRY_RUN:-0}"

      CACHE_DIRS=(/home/gitlab-runner/cache /home/gitlab-runner/.cache /var/lib/gitlab-runner/cache /root/.cache)
      BUILD_DIRS=(/home/gitlab-runner/builds /var/lib/gitlab-runner/builds)

      log()  { logger -t runner-weekly-cleanup -- "$*"; echo "$(date -u +%FT%TZ) $*"; }
      disk() { df --output=used,avail,pcent -h / | tail -1 | xargs; }

      run() {
        log "-> $*"
        [[ "$DRY_RUN" == "1" ]] && return 0
        "$@" || log "WARN: failed: $*"
      }

      wipe_dir() {
        local dir="$1" age="${2:-}"
        [[ -d "$dir" ]] || return 0
        if [[ -n "$age" ]]; then
          log "-> cleaning $dir older than ${age}d"
          [[ "$DRY_RUN" == "1" ]] && return 0
          find "$dir" -mindepth 1 -mtime +"$age" -delete 2>/dev/null || log "WARN: partial cleanup of $dir"
        else
          log "-> wiping $dir"
          [[ "$DRY_RUN" == "1" ]] && return 0
          find "$dir" -mindepth 1 -delete 2>/dev/null || log "WARN: partial wipe of $dir"
        fi
      }

      usage() {
        cat <<USAGE
      Usage: $0 [--help]
      Env:
        RETENTION_DAYS              keep images, builds and temp files newer than N days (default: 7)
        JOURNAL_MAX                 max systemd journal size (default: 500M)
        SHARED_CACHE_DIR            shared CI cache directory (default: /srv/ci-cache)
        SHARED_CACHE_MAX_AGE_DAYS   prune shared cache files not accessed for N days (default: 14)
        DRY_RUN=1                   show what would be cleaned without deleting anything
      USAGE
      }

      if [[ "${1:-}" == "-h" || "${1:-}" == "--help" ]]; then usage; exit 0; fi
      [[ $EUID -eq 0 ]] || { echo "run as root" >&2; exit 1; }

      exec 9>/run/runner-weekly-cleanup.lock
      flock -n 9 || { log "another cleanup is running, exit"; exit 0; }

      hours=$(( RETENTION_DAYS * 24 ))
      log "start (dry_run=${DRY_RUN}), disk before: $(disk)"

      if command -v docker >/dev/null 2>&1; then
        running=$(docker ps -q --filter "label=com.gitlab.gitlab-runner.managed=true" | wc -l)
        if (( running > 0 )); then
          log "WARN: ${running} job container(s) running, skipping cache wipe"
        else
          run /usr/share/gitlab-runner/clear-docker-cache prune-volumes
          if [[ "$DRY_RUN" != "1" ]]; then
            docker volume ls -q --filter name=runner- | xargs -r docker volume rm >/dev/null 2>&1 || log "WARN: some runner volumes in use"
          fi
          for dir in "${CACHE_DIRS[@]}"; do wipe_dir "$dir"; done
        fi
        run docker container prune -f --filter "until=${hours}h"
        run docker image prune -af --filter "until=${hours}h"
        run docker builder prune -af --filter "until=${hours}h"
        run docker network prune -f --filter "until=${hours}h"
      fi

      for dir in "${BUILD_DIRS[@]}"; do wipe_dir "$dir" "$RETENTION_DAYS"; done

      if command -v apt-get >/dev/null 2>&1; then
        run apt-get -o DPkg::Lock::Timeout=600 autoremove --purge -y -q
        run apt-get -o DPkg::Lock::Timeout=600 autoclean -q
        run apt-get -o DPkg::Lock::Timeout=600 clean -q
      elif command -v dnf >/dev/null 2>&1; then
        run dnf -y -q autoremove
        run dnf -q clean all
      fi

      run journalctl --vacuum-time="$(( RETENTION_DAYS * 2 ))d" --vacuum-size="$JOURNAL_MAX"

      if [[ "$DRY_RUN" != "1" ]]; then
        log "-> removing rotated logs older than 30d"
        find /var/log -type f \( -name '*.gz' -o -name '*-[0-9]*' -o -name '*.[0-9]' -o -name '*.old' \) -mtime +30 -delete 2>/dev/null || true
        find /tmp /var/tmp -xdev -mindepth 1 -type f -atime +"$RETENTION_DAYS" -delete 2>/dev/null || true
      fi
      run systemd-tmpfiles --clean

      if [[ -d "$SHARED_CACHE_DIR" && "$DRY_RUN" != "1" ]]; then
        log "-> pruning ${SHARED_CACHE_DIR} files not used for ${SHARED_CACHE_MAX_AGE_DAYS}d"
        find "$SHARED_CACHE_DIR" -xdev -type f -atime +"$SHARED_CACHE_MAX_AGE_DAYS" -delete 2>/dev/null || true
        find "$SHARED_CACHE_DIR" -xdev -mindepth 2 -type d -empty -delete 2>/dev/null || true
      fi

      log "done, disk after: $(disk)"

  - path: /usr/local/bin/runner-disk-guard.sh
    permissions: '0755'
    content: |
      #!/usr/bin/env bash
      # Emergency cleanup when the root filesystem crosses HARD_LIMIT percent.
      set -Eeuo pipefail

      HARD_LIMIT="${HARD_LIMIT:-85}"

      if [[ "${1:-}" == "-h" || "${1:-}" == "--help" ]]; then
        echo "Usage: $0  (env: HARD_LIMIT=85) runs runner-weekly-cleanup.sh with RETENTION_DAYS=1 when disk usage >= HARD_LIMIT%"
        exit 0
      fi

      used=$(df --output=pcent / | tail -1 | tr -dc '0-9')
      if (( used >= HARD_LIMIT )); then
        logger -t runner-disk-guard -- "disk ${used}% >= ${HARD_LIMIT}%, running emergency cleanup"
        RETENTION_DAYS=1 /usr/local/bin/runner-weekly-cleanup.sh
      fi

  - path: /etc/systemd/system/runner-weekly-cleanup.service
    permissions: '0644'
    content: |
      [Unit]
      Description=Weekly cleanup of GitLab Runner host
      After=docker.service

      [Service]
      Type=oneshot
      ExecStart=/usr/local/bin/runner-weekly-cleanup.sh
      Nice=10
      IOSchedulingClass=idle

  - path: /etc/systemd/system/runner-weekly-cleanup.timer
    permissions: '0644'
    content: |
      [Unit]
      Description=Run runner cleanup every Monday

      [Timer]
      OnCalendar=Mon *-*-* 03:30:00
      Persistent=true
      RandomizedDelaySec=10m

      [Install]
      WantedBy=timers.target

  - path: /etc/systemd/system/runner-disk-guard.service
    permissions: '0644'
    content: |
      [Unit]
      Description=Emergency disk cleanup when usage is high
      After=docker.service

      [Service]
      Type=oneshot
      ExecStart=/usr/local/bin/runner-disk-guard.sh

  - path: /etc/systemd/system/runner-disk-guard.timer
    permissions: '0644'
    content: |
      [Unit]
      Description=Check disk usage every 30 minutes

      [Timer]
      OnBootSec=10m
      OnUnitActiveSec=30m

      [Install]
      WantedBy=timers.target

runcmd:
  - restorecon -Rv /etc/ssh/sshd_config.d /etc/docker /etc/gitlab-runner /usr/local/bin /etc/systemd/system
  - [systemctl, reload, sshd]
  - [sh, -c, "dnf -y -q install epel-release || echo optional-tool-missing-epel >> /var/log/ci-bootstrap-failed.log; for p in htop btop ncdu iotop mtr nano vim-enhanced rsync wget unzip tar bash-completion skopeo restic dnf-utils; do dnf -y -q install $p || echo optional-tool-missing-$p >> /var/log/ci-bootstrap-failed.log; done"]
  - sed -i -E 's/^upgrade_type = .*/upgrade_type = security/; s/^apply_updates = .*/apply_updates = yes/' /etc/dnf/automatic.conf
  - [systemctl, enable, --now, dnf-automatic.timer]
  - [systemctl, restart, systemd-journald]
  - [timedatectl, set-timezone, Europe/Kyiv]
  - sh -c 'systemctl is-enabled firewalld >/dev/null 2>&1 && systemctl disable --now firewalld || true'
  - curl -fsSL https://download.docker.com/linux/rhel/docker-ce.repo -o /etc/yum.repos.d/docker-ce.repo
  - dnf -y -q install docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
  - [systemctl, enable, --now, docker]
  - semanage fcontext -a -t container_file_t '/opt/registry-cache(/.*)?'
  - restorecon -R /opt/registry-cache
  - docker compose -f /opt/registry-cache/docker-compose.yml up -d
  - curl -fsSL https://packages.gitlab.com/install/repositories/runner/gitlab-runner/script.rpm.sh -o /tmp/runner-repo.sh
  - bash /tmp/runner-repo.sh
  - dnf -y -q install gitlab-runner
  - usermod -aG docker gitlab-runner
  - chmod 600 /etc/gitlab-runner/config.toml
  - [systemctl, daemon-reload]
  - [systemctl, enable, --now, runner-weekly-cleanup.timer, runner-disk-guard.timer]
  - sed -i -E 's/^SELINUX=.*/SELINUX=enforcing/' /etc/selinux/config
  - setenforce 1
