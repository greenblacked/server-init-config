name: stacks

# other/torrserver and other/lampa-stack on a real Docker host with internet (ubuntu runner VM), real pinned images.
# Runs on every push to main, on pull requests that touch other/ or tools/ci/, weekly (image digests, upstream changes), on demand.
# Public mode with Let's Encrypt is not covered: the runner has no inbound port 80 from the internet (TorrServer uses Caddy's
# own CA through TS_TLS=internal; the lampa stack is tested in --local and --vpn mode). See the header of each script.
# Same run on a disposable VM: sudo ALLOW_LOCAL=1 tools/ci/stack-torrserver.sh ; sudo ALLOW_LOCAL=1 tools/ci/stack-lampa.sh

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'other/**'
      - 'tools/ci/**'
      - '.github/workflows/stacks.yml'
  schedule:
    - cron: '27 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: stacks-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  torrserver:
    name: TorrServer (local, public, switch, purge)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: TorrServer end to end
        timeout-minutes: 26
        run: sudo -E tools/ci/stack-torrserver.sh
      - name: Upload logs on failure
        if: ${{ !cancelled() && failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: torrserver-logs
          path: ci-out/
          if-no-files-found: ignore
          retention-days: 7

  lampa-stack:
    name: Lampa stack (real Lampac, smoke, WireGuard)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Lampa stack end to end
        timeout-minutes: 55
        run: sudo -E tools/ci/stack-lampa.sh
      - name: Upload logs on failure
        if: ${{ !cancelled() && failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lampa-logs
          path: ci-out/
          if-no-files-found: ignore
          retention-days: 7
