name: runner-matrix

# The GitLab Runner host pieces that need no GitLab token (no runner is ever registered here):
#   container   users, admin tools, health, timers, firewall, fail2ban, job limits in a systemd container (Rocky 10, Debian 13)
#   host        Docker-dependent parts directly on the runner VM: registry cache, job isolation (DOCKER-USER), npm cache stack.
#               They cannot be tested inside a container: the rules belong to the netfilter of the machine that runs dockerd.
#   cloud-init  the runner cloud-init files against the real cloud-init schema
# Runs on pull requests and pushes to main that touch runner/, common/ or tools/ci/, weekly, and on demand.
# Same run locally: tools/ci/runner-e2e.sh debian:13 ; sudo ALLOW_LOCAL=1 tools/ci/runner-host-e2e.sh (disposable VM only)

on:
  push:
    branches: [main]
    paths:
      - 'runner/**'
      - 'common/**'
      - 'tools/ci/**'
      - '.github/workflows/runner-matrix.yml'
  pull_request:
    paths:
      - 'runner/**'
      - 'common/**'
      - 'tools/ci/**'
      - '.github/workflows/runner-matrix.yml'
  schedule:
    - cron: '47 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: runner-matrix-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  container:
    name: systemd container (${{ matrix.image }})
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        image:
          - rockylinux/rockylinux:10
          - debian:13
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Runner components without token or Docker (${{ matrix.image }})
        run: tools/ci/runner-e2e.sh "${{ matrix.image }}"
      - name: Upload logs on failure
        if: ${{ !cancelled() && failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runner-container-${{ strategy.job-index }}-logs
          path: ci-out/
          if-no-files-found: ignore
          retention-days: 7

  host:
    name: Docker host (registry cache, job isolation, npm cache)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Registry cache, DOCKER-USER isolation, npm cache stack
        run: sudo -E tools/ci/runner-host-e2e.sh
      - name: Upload logs on failure
        if: ${{ !cancelled() && failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: runner-host-logs
          path: ci-out/
          if-no-files-found: ignore
          retention-days: 7

  cloud-init:
    name: runner cloud-init schema
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Install cloud-init
        run: |
          sudo apt-get update -q
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -q cloud-init python3-yaml
      - name: cloud-init schema on every runner file
        run: |
          for f in runner/cloud-init/*.yaml; do
            echo "== $f"
            cloud-init schema --config-file "$f"
          done
