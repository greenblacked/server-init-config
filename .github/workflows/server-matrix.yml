name: server-matrix

# The plain-server init on every supported OS, for real: a systemd container per OS, the real server/bootstrap.sh over its
# sshd, real package mirrors. Runs on every push to main, on pull requests that touch server/, common/ or tools/ci/, weekly
# (to catch a distro mirror or package change), and on demand. Each OS runs on amd64 and arm64 runners.
# Same run locally (needs Docker, ~10 min each): tools/ci/server-e2e.sh debian:13

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'server/**'
      - 'common/**'
      - 'tools/ci/**'
      - '.github/workflows/server-matrix.yml'
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: server-matrix-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  e2e:
    name: ${{ matrix.image }} (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        runner: [ubuntu-24.04, ubuntu-24.04-arm]
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
        image:
          - quay.io/centos/centos:stream10
          - rockylinux/rockylinux:10
          - almalinux:10
          - fedora:44
          - ubuntu:26.04
          - debian:13
          - opensuse/leap:16.0
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Server init end to end (${{ matrix.image }})
        timeout-minutes: 35
        run: tools/ci/server-e2e.sh "${{ matrix.image }}"
      - name: Upload logs on failure
        if: ${{ !cancelled() && failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: server-${{ matrix.arch }}-${{ strategy.job-index }}-logs
          path: ci-out/
          if-no-files-found: ignore
          retention-days: 7
