name: vm

# The cloud-init files users paste into Hetzner, tested on a REAL virtual machine: the official cloud image of each OS boots
# under QEMU/KVM with the repo's YAML as NoCloud user-data (unchanged), cloud-init runs for real, then swap, sysctl, Docker,
# the firewall, fail2ban and the admin user are checked, the VM is rebooted and checked again, and server-init.sh is rerun to
# prove it changes nothing. A container cannot show any of that. Runs on every push to main, on pull requests that touch the
# cloud-init files or these tests, weekly (images and mirrors change) and on demand.
# Same run locally on a Linux box with KVM (~15 min each): ALLOW_LOCAL=1 tools/ci/vm-e2e.sh debian13
# Image URLs and checksum handling: tools/ci/vm-images.sh. The runner files are booted WITHOUT a GitLab token: nothing is registered.

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - 'server/**'
      - 'runner/cloud-init/**'
      - 'common/**'
      - 'tools/ci/vm*'
      - 'tools/ci/lib.sh'
      - 'tools/ci/server-assert.sh'
      - '.github/workflows/vm.yml'
  schedule:
    - cron: '41 5 * * 1'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vm-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  vm:
    name: ${{ matrix.key }} (${{ matrix.label }})
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - { key: rocky10, label: Rocky Linux 10 / server-el10 }
          - { key: alma10, label: AlmaLinux 10 / server-el10 }
          - { key: centos10, label: CentOS Stream 10 / server-el10 }
          - { key: fedora44, label: Fedora 44 / server-fedora }
          - { key: debian13, label: Debian 13 / server-debian }
          - { key: ubuntu2604, label: Ubuntu 26.04 / server-debian }
          - { key: opensuse16, label: openSUSE Leap 16.0 / server-opensuse }
          - { key: runner-rocky10, label: Rocky Linux 10 / runner rocky-x86 (no token) }
          - { key: runner-debian13, label: Debian 13 / runner debian-x86 (no token) }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Enable KVM
        run: |
          # Documented for GitHub-hosted Linux runners: the udev rule makes /dev/kvm usable without root.
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          if [[ ! -c /dev/kvm ]]; then
            echo "::error::/dev/kvm is missing on this runner: the VM tests need hardware virtualization (GitHub-hosted ubuntu-24.04 x64 provides it)"
            exit 1
          fi
          ls -l /dev/kvm
      - name: Install QEMU and the seed ISO tool
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends qemu-system-x86 qemu-utils genisoimage ovmf openssh-client python3-yaml
          qemu-system-x86_64 --version | head -1
      - name: Self test (checksum parser, catalogue, seed ISO)
        run: tools/ci/vm-selftest.sh
      - name: Boot and test (${{ matrix.key }})
        # Shorter than the job limit on purpose: a step timeout fails only this step, so the log upload below still runs.
        timeout-minutes: 24
        env:
          VM_CACHE: ${{ github.workspace }}/.vm-cache
        run: tools/ci/vm-e2e.sh "${{ matrix.key }}"
      - name: Upload logs on failure
        if: ${{ !cancelled() && failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: vm-${{ matrix.key }}-logs
          path: ci-out/
          if-no-files-found: ignore
          retention-days: 7
