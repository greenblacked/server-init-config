# Keeps pinned versions current by pull request. For GitHub Actions Dependabot rewrites the full-SHA pin and its
# "# vX.Y.Z" comment together. The lint checks (tools/ci/check-pins.sh) keep every action SHA-pinned.
# Not covered on purpose: other/lampa-stack and common/security/kali take their image from an environment variable or
# build argument (Dependabot cannot see a value that is only set in .env or install scripts); the tool versions and
# SHA-256 values in tools/ci/install-*.sh and common/security-tools.sh are bumped by hand together with the hash.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: ci

  # Compose files whose images are literal and tag-pinned and that no generated file embeds. Only server/ai qualifies.
  # Left out on purpose:
  #  - runner/stacks/registry-cache is embedded in the rendered cloud-init files (@@FILE@@ in
  #    runner/cloud-init/templates/common-files.yaml.in), and every runner/stacks/* directory (registry-cache,
  #    monitoring, logging, npm-cache) is embedded in runner/COMMANDS.md by tools/render-paste-commands.py. A Dependabot
  #    PR edits only the compose file, so the render --check in tools/ci/lint.sh always fails on it.
  #    To bump an embedded image by hand: edit the compose file, run tools/render-cloud-init.py and
  #    tools/render-paste-commands.py, commit the compose file and the regenerated files together.
  #    Dependabot never bumps runner/stacks/{logging,monitoring,npm-cache,registry-cache}: check them periodically.
  #  - other/torrserver: both of its images come from ${VAR} / ${VAR:-default} interpolation, which Dependabot's
  #    compose parser is not known to resolve.
  - package-ecosystem: docker-compose
    directories:
      - /server/ai
    schedule:
      interval: weekly
    groups:
      compose-images:
        patterns: ["*"]
    commit-message:
      prefix: deps
