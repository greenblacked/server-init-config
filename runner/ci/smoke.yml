# Quick check that jobs land on the self-hosted ARM runner.
# Replace arm64 with the tag set on your runner in the GitLab UI.
arm_smoke:
  image: alpine:3.22@sha256:2e0b81d60597f449baa56dc25d355367869d2dca4cd57e866f1e2b52af3eb55f
  tags: [arm64]
  script:
    - uname -m
    - head -2 /etc/os-release
    - nproc && free -m
