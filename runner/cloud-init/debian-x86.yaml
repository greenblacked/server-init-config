#cloud-config
# Debian 13 on x86_64 (Hetzner CX/CPX/CCX): Docker, GitLab Runner, Docker Hub cache, cleanup timers.
# Same content as debian.yaml, which is architecture-independent; this copy is labelled for x86 servers.
# Login stays root with your SSH key on port 22; only password logins are switched off.
# Generated by tools/render-cloud-init.py from runner/cloud-init/templates. Do not edit by hand.
package_update: true
package_upgrade: true

packages:
  - sudo
  - curl
  - ca-certificates
  - gnupg
  - git
  - jq
  - htop
  - tmux
  - unattended-upgrades

ssh_pwauth: false

write_files:
  - path: /etc/ssh/sshd_config.d/00-ci-hardening.conf
    permissions: '0600'
    content: |
      PasswordAuthentication no
      KbdInteractiveAuthentication no
      PermitRootLogin prohibit-password
      X11Forwarding no

  - path: /etc/gai.conf
    append: true
    content: |
      precedence ::ffff:0:0/96  100

  - path: /etc/systemd/journald.conf.d/50-size.conf
    permissions: '0644'
    content: |
      [Journal]
      SystemMaxUse=500M
      MaxRetentionSec=14day

  - path: /etc/docker/daemon.json
    permissions: '0644'
    content: |
      {
        "log-driver": "json-file",
        "log-opts": { "max-size": "50m", "max-file": "3" },
        "registry-mirrors": ["http://127.0.0.1:5000"]
      }

  - path: /etc/gitlab-runner/config.toml
    permissions: '0600'
    content: |
      concurrent = 2
      check_interval = 0
      listen_address = "127.0.0.1:9252"

  - path: /opt/registry-cache/config.yml
    permissions: '0644'
    content: |
      version: 0.1
      log:
        level: info
        fields:
          service: registry-cache
      storage:
        filesystem:
          rootdirectory: /var/lib/registry
        delete:
          enabled: true
        cache:
          blobdescriptor: inmemory
      http:
        addr: 127.0.0.1:5000
        headers:
          X-Content-Type-Options: [nosniff]
        debug:
          addr: 127.0.0.1:5001
          prometheus:
            enabled: true
            path: /metrics
      proxy:
        remoteurl: https://registry-1.docker.io
      health:
        storagedriver:
          enabled: true
          interval: 10s
          threshold: 3

  - path: /opt/registry-cache/docker-compose.yml
    permissions: '0644'
    content: |
      name: registry-cache

      services:
        registry:
          image: registry:2.8.3
          restart: unless-stopped
          network_mode: host
          mem_limit: 128m
          volumes:
            - ./config.yml:/etc/docker/registry/config.yml:ro
            - registry-data:/var/lib/registry

      volumes:
        registry-data:

  - path: /usr/local/bin/runner-weekly-cleanup.sh
    permissions: '0755'
    content: |
      #!/usr/bin/env bash
      # Weekly cleanup of the GitLab Runner host: Docker, runner caches, packages, logs, temp files.
      set -Eeuo pipefail

      RETENTION_DAYS="${RETENTION_DAYS:-7}"
      JOURNAL_MAX="${JOURNAL_MAX:-500M}"
      SHARED_CACHE_DIR="${SHARED_CACHE_DIR:-/srv/ci-cache}"
      SHARED_CACHE_MAX_AGE_DAYS="${SHARED_CACHE_MAX_AGE_DAYS:-14}"
      DRY_RUN="${DRY_RUN:-0}"

      CACHE_DIRS=(/home/gitlab-runner/cache /home/gitlab-runner/.cache /var/lib/gitlab-runner/cache /root/.cache)
      BUILD_DIRS=(/home/gitlab-runner/builds /var/lib/gitlab-runner/builds)

      log()  { logger -t runner-weekly-cleanup -- "$*"; echo "$(date -u +%FT%TZ) $*"; }
      disk() { df --output=used,avail,pcent -h / | tail -1 | xargs; }

      run() {
        log "-> $*"
        [[ "$DRY_RUN" == "1" ]] && return 0
        "$@" || log "WARN: failed: $*"
      }

      wipe_dir() {
        local dir="$1" age="${2:-}"
        [[ -d "$dir" ]] || return 0
        if [[ -n "$age" ]]; then
          log "-> cleaning $dir older than ${age}d"
          [[ "$DRY_RUN" == "1" ]] && return 0
          find "$dir" -mindepth 1 -mtime +"$age" -delete 2>/dev/null || log "WARN: partial cleanup of $dir"
        else
          log "-> wiping $dir"
          [[ "$DRY_RUN" == "1" ]] && return 0
          find "$dir" -mindepth 1 -delete 2>/dev/null || log "WARN: partial wipe of $dir"
        fi
      }

      usage() {
        cat <<USAGE
      Usage: $0 [--dry-run] [--help]
        --dry-run                   same as DRY_RUN=1: show what would be cleaned without deleting anything
      Env:
        RETENTION_DAYS              keep images, builds and temp files newer than N days (default: 7)
        JOURNAL_MAX                 max systemd journal size (default: 500M)
        SHARED_CACHE_DIR            shared CI cache directory (default: /srv/ci-cache)
        SHARED_CACHE_MAX_AGE_DAYS   prune shared cache files not accessed for N days (default: 14)
        DRY_RUN=1                   show what would be cleaned without deleting anything
      USAGE
      }

      while (( $# )); do
        case "$1" in
          -h|--help) usage; exit 0 ;;
          -n|--dry-run) DRY_RUN=1 ;;
          *) usage >&2; echo "unknown option: $1" >&2; exit 2 ;;
        esac
        shift
      done
      [[ $EUID -eq 0 ]] || { echo "run as root" >&2; exit 1; }

      exec 9>/run/runner-weekly-cleanup.lock
      flock -n 9 || { log "another cleanup is running, exit"; exit 0; }

      hours=$(( RETENTION_DAYS * 24 ))
      log "start (dry_run=${DRY_RUN}), disk before: $(disk)"

      if command -v docker >/dev/null 2>&1; then
        # Never guess the job count: if docker does not answer, a default of 0 would wipe the caches under running jobs.
        # stderr goes to a temp file so a docker WARNING is never counted as a running job.
        ps_err=$(mktemp)
        trap 'rm -f "$ps_err"' EXIT
        if ! job_ids=$(docker ps -q --filter "label=com.gitlab.gitlab-runner.managed=true" 2>"$ps_err"); then
          log "ERROR: docker is not responding, cleanup skipped: $(cat "$ps_err")"
          exit 1
        fi
        running=$(wc -w <<<"$job_ids")
        if (( running > 0 )); then
          log "WARN: ${running} job container(s) running, skipping cache wipe"
        else
          run /usr/share/gitlab-runner/clear-docker-cache prune-volumes
          if [[ "$DRY_RUN" != "1" ]]; then
            docker volume ls -q --filter name=runner- | xargs -r docker volume rm >/dev/null 2>&1 || log "WARN: some runner volumes in use"
          fi
          for dir in "${CACHE_DIRS[@]}"; do wipe_dir "$dir"; done
        fi
        run docker container prune -f --filter "until=${hours}h"
        run docker image prune -af --filter "until=${hours}h"
        run docker builder prune -af --filter "until=${hours}h"
        run docker network prune -f --filter "until=${hours}h"
      fi

      for dir in "${BUILD_DIRS[@]}"; do wipe_dir "$dir" "$RETENTION_DAYS"; done

      if command -v apt-get >/dev/null 2>&1; then
        run apt-get -o DPkg::Lock::Timeout=600 autoremove --purge -y -q
        run apt-get -o DPkg::Lock::Timeout=600 autoclean -q
        run apt-get -o DPkg::Lock::Timeout=600 clean -q
      elif command -v dnf >/dev/null 2>&1; then
        run dnf -y -q autoremove
        run dnf -q clean all
      fi

      run journalctl --vacuum-time="$(( RETENTION_DAYS * 2 ))d" --vacuum-size="$JOURNAL_MAX"

      if [[ "$DRY_RUN" != "1" ]]; then
        log "-> removing rotated logs older than 30d"
        find /var/log -type f \( -name '*.gz' -o -name '*-[0-9]*' -o -name '*.[0-9]' -o -name '*.old' \) -mtime +30 -delete 2>/dev/null || true
        find /tmp /var/tmp -xdev -mindepth 1 -type f -atime +"$RETENTION_DAYS" -delete 2>/dev/null || true
      fi
      run systemd-tmpfiles --clean

      if [[ -d "$SHARED_CACHE_DIR" && "$DRY_RUN" != "1" ]]; then
        log "-> pruning ${SHARED_CACHE_DIR} files not used for ${SHARED_CACHE_MAX_AGE_DAYS}d"
        find "$SHARED_CACHE_DIR" -xdev -type f -atime +"$SHARED_CACHE_MAX_AGE_DAYS" -delete 2>/dev/null || true
        find "$SHARED_CACHE_DIR" -xdev -mindepth 2 -type d -empty -delete 2>/dev/null || true
      fi

      log "done, disk after: $(disk)"

  - path: /usr/local/bin/runner-disk-guard.sh
    permissions: '0755'
    content: |
      #!/usr/bin/env bash
      # Emergency cleanup when the root filesystem crosses HARD_LIMIT percent.
      set -Eeuo pipefail

      HARD_LIMIT="${HARD_LIMIT:-85}"

      if [[ "${1:-}" == "-h" || "${1:-}" == "--help" ]]; then
        echo "Usage: $0  (env: HARD_LIMIT=85) runs runner-weekly-cleanup.sh with RETENTION_DAYS=1 when disk usage >= HARD_LIMIT%"
        exit 0
      fi

      used=$(df --output=pcent / | tail -1 | tr -dc '0-9')
      if (( used >= HARD_LIMIT )); then
        logger -t runner-disk-guard -- "disk ${used}% >= ${HARD_LIMIT}%, running emergency cleanup"
        RETENTION_DAYS=1 /usr/local/bin/runner-weekly-cleanup.sh
      fi

  - path: /etc/systemd/system/runner-weekly-cleanup.service
    permissions: '0644'
    content: |
      [Unit]
      Description=Weekly cleanup of GitLab Runner host
      After=docker.service

      [Service]
      Type=oneshot
      ExecStart=/usr/local/bin/runner-weekly-cleanup.sh
      Nice=10
      IOSchedulingClass=idle

  - path: /etc/systemd/system/runner-weekly-cleanup.timer
    permissions: '0644'
    content: |
      [Unit]
      Description=Run runner cleanup every Monday

      [Timer]
      OnCalendar=Mon *-*-* 03:30:00
      Persistent=true
      RandomizedDelaySec=10m

      [Install]
      WantedBy=timers.target

  - path: /etc/systemd/system/runner-disk-guard.service
    permissions: '0644'
    content: |
      [Unit]
      Description=Emergency disk cleanup when usage is high
      After=docker.service

      [Service]
      Type=oneshot
      ExecStart=/usr/local/bin/runner-disk-guard.sh

  - path: /etc/systemd/system/runner-disk-guard.timer
    permissions: '0644'
    content: |
      [Unit]
      Description=Check disk usage every 30 minutes

      [Timer]
      OnBootSec=10m
      OnUnitActiveSec=30m

      [Install]
      WantedBy=timers.target

  - path: /etc/profile.d/90-shell-history.sh
    permissions: '0644'
    content: |
      # shellcheck shell=bash
      # Shell history and fzf key bindings for interactive bash (Ctrl+R history search, Ctrl+T file search).
      # Installed as /etc/profile.d/90-shell-history.sh (runner hosts) or 90-server-shell.sh (plain servers).
      # The same text is embedded in the server/server-init-*.sh scripts (they must stay self-contained):
      # keep all copies identical, tools/test-cloud-init.py checks that.
      [ -n "${BASH_VERSION-}" ] || return 0
      [[ $- == *i* ]] || return 0

      __shell_history_vars() {
        HISTSIZE=100000
        HISTFILESIZE=200000
        HISTTIMEFORMAT='%F %T  '
        HISTCONTROL=ignoreboth:erasedups
      }
      __shell_history_vars
      shopt -s histappend cmdhist

      # Run before each prompt: append the last command to the history file so parallel sessions share history.
      # On Debian and Ubuntu the user's ~/.bashrc runs after this file and lowers the limits, so the first
      # prompt applies them again (a later change by hand in a session is kept).
      __shell_history_prompt() {
        history -a
        if [[ -z "${__shell_history_done-}" ]]; then
          __shell_history_done=1
          __shell_history_vars
        fi
      }
      # Keeps an existing PROMPT_COMMAND (string or array) and is safe to source twice.
      # When PROMPT_COMMAND is still empty (Fedora/EL login shells read profile.d before /etc/bashrc, which sets
      # the terminal title only if PROMPT_COMMAND is empty), use an array with an empty first element: /etc/bashrc
      # then fills element 0 with its title command and the hook stays in element 1 (bash 5.1+ runs every element).
      if [[ -z "${PROMPT_COMMAND-}" && "$(declare -p PROMPT_COMMAND 2>/dev/null)" != "declare -a"* ]] && (( BASH_VERSINFO[0] > 5 || (BASH_VERSINFO[0] == 5 && BASH_VERSINFO[1] >= 1) )); then
        unset PROMPT_COMMAND
        PROMPT_COMMAND=('' '__shell_history_prompt')
      fi
      case "$(declare -p PROMPT_COMMAND 2>/dev/null)" in
        "declare -a"*)
          [[ " ${PROMPT_COMMAND[*]} " == *" __shell_history_prompt "* ]] || PROMPT_COMMAND+=('__shell_history_prompt')
          ;;
        *)
          if [[ "${PROMPT_COMMAND-}" != *__shell_history_prompt* ]]; then
            __pc="${PROMPT_COMMAND-}"
            while [[ "$__pc" == *[[:space:]\;] ]]; do __pc="${__pc%?}"; done
            # shellcheck disable=SC2178
            PROMPT_COMMAND="${__pc:+$__pc;}__shell_history_prompt"
            unset __pc
          fi
          ;;
      esac

      # Debian and Ubuntu install fd as fdfind.
      if ! command -v fd >/dev/null 2>&1 && command -v fdfind >/dev/null 2>&1; then
        alias fd=fdfind
        __fd=fdfind
      elif command -v fd >/dev/null 2>&1; then
        __fd=fd
      fi
      if [[ -n "${__fd-}" ]]; then
        export FZF_DEFAULT_COMMAND="${FZF_DEFAULT_COMMAND:-$__fd --type f --hidden --follow --exclude .git}"
        export FZF_CTRL_T_COMMAND="${FZF_CTRL_T_COMMAND:-$FZF_DEFAULT_COMMAND}"
        export FZF_ALT_C_COMMAND="${FZF_ALT_C_COMMAND:-$__fd --type d --hidden --follow --exclude .git}"
      fi
      unset __fd

      if command -v fzf >/dev/null 2>&1; then
        for __f in /usr/share/fzf/shell/key-bindings.bash /usr/share/doc/fzf/examples/key-bindings.bash; do
          if [[ -r "$__f" ]]; then
            # shellcheck source=/dev/null
            . "$__f"
            __fzf_done=1
            break
          fi
        done
        # fzf 0.48+ can print its own bindings when the package ships no file.
        if [[ -z "${__fzf_done-}" ]] && __fzf_b=$(fzf --bash 2>/dev/null); then
          eval "$__fzf_b"
        fi
        unset __f __fzf_done __fzf_b
      fi

  - path: /etc/apt/preferences.d/pin-gitlab-runner.pref
    permissions: '0644'
    content: |
      Explanation: Prefer GitLab provided packages over the Debian native ones
      Package: gitlab-runner
      Pin: origin packages.gitlab.com
      Pin-Priority: 1001

runcmd:
  - [sh, -c, "if sshd -t; then systemctl reload ssh; else rm -f /etc/ssh/sshd_config.d/00-ci-hardening.conf; echo ssh-dropin-rejected-defaults-kept >> /var/log/ci-bootstrap-failed.log; fi"]
  - [systemctl, enable, --now, unattended-upgrades]
  - [sh, -c, "for p in mc fd-find ripgrep fzf; do apt-get install -y -q $p || echo optional-tool-missing-$p >> /var/log/ci-bootstrap-failed.log; done; if command -v fdfind >/dev/null 2>&1 && ! command -v fd >/dev/null 2>&1; then ln -sfn $(command -v fdfind) /usr/local/bin/fd; fi"]
  - [sh, -c, "for rc in /etc/skel/.bashrc /root/.bashrc /home/*/.bashrc; do [ -f $rc ] && sed -i -E 's/^(HISTSIZE=1000|HISTFILESIZE=2000)$/# &/' $rc; done; true"]
  - [systemctl, restart, systemd-journald]
  - [timedatectl, set-timezone, Europe/Kyiv]
  - install -m 0755 -d /etc/apt/keyrings
  - curl -fsSL https://download.docker.com/linux/debian/gpg -o /etc/apt/keyrings/docker.asc
  - chmod a+r /etc/apt/keyrings/docker.asc
  - sh -c '. /etc/os-release; echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/debian ${VERSION_CODENAME} stable" > /etc/apt/sources.list.d/docker.list'
  - apt-get update -q
  - apt-get install -y -q docker-ce docker-ce-cli containerd.io docker-buildx-plugin docker-compose-plugin
  - [systemctl, enable, --now, docker]
  - docker compose -f /opt/registry-cache/docker-compose.yml up -d
  - curl -fsSL https://packages.gitlab.com/install/repositories/runner/gitlab-runner/script.deb.sh -o /tmp/runner-repo.sh
  - bash /tmp/runner-repo.sh
  - apt-get install -y -q gitlab-runner
  - usermod -aG docker gitlab-runner
  - chmod 600 /etc/gitlab-runner/config.toml
  - [systemctl, daemon-reload]
  - [systemctl, enable, --now, runner-weekly-cleanup.timer, runner-disk-guard.timer]
