# Lists every tag of the mirrored images and reports whether an arm64 variant exists.
# Run manually: Build -> Pipelines -> Run pipeline.
check_arm64_mirrors:
  image:
    name: gcr.io/go-containerregistry/crane:debug
    entrypoint: [""]
  tags: [arm64]
  rules:
    - if: $CI_PIPELINE_SOURCE == "web"
  script:
    - crane auth login "$CI_REGISTRY" -u "$CI_REGISTRY_USER" -p "$CI_REGISTRY_PASSWORD"
    - |
      for repo in mirror/alpine mirror/node mirror/playwright mirror/snyk mirror/sonar-scanner-cli docker; do
        for tag in $(crane ls "$CI_REGISTRY_IMAGE/$repo"); do
          ref="$CI_REGISTRY_IMAGE/$repo:$tag"
          if crane manifest "$ref" | grep -q '"architecture": *"arm64"'; then
            echo "OK      $ref (multi-arch)"
          elif crane config "$ref" 2>/dev/null | grep -q '"architecture": *"arm64"'; then
            echo "OK      $ref (arm64 only)"
          else
            echo "NO ARM  $ref"
          fi
        done
      done
